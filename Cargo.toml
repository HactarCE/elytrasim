[package]
name = "elytrasim"
version = "0.1.0"
edition = "2024"

[dependencies]
approx = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
itertools = "0.15.0"
npyz = "0.9.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"


[features]
# used for eg not inlining functions so they show up when profiling
# #[cfg_attr(feature = "profiling", inline(never))]
profiling = []

[profile.dev]
opt-level = 3

[profile.profiling]
# samply record cargo run --profile profiling --features profiling
# cargo instruments -t time --profile profiling --features profiling
inherits = "release"
debug = true
split-debuginfo = "packed"
